<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#0F172A;
}

/* Header */

header{
    background:#1E3A8A;
    color:white;
    padding:18px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h2{
    font-size:24px;
}

.logout{
    background:#EF4444;
    color:white;
    padding:10px 18px;
    text-decoration:none;
    border-radius:6px;
}

.logout:hover{
    background:#DC2626;
}


/* Main container */

.container{
    width:90%;
    margin:30px auto;
}

.container h1{
    color:white;
    margin-bottom:20px;
}


/* Cards */

.cards{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    margin-bottom:30px;
}

.card{
    flex:1;
    min-width:200px;
    background:#F8F8F2;
    padding:20px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.25);
}

.card h2{
    color:#1E3A8A;
    font-size:30px;
}

.card p{
    margin-top:10px;
    font-weight:bold;
}


/* Table */

table{
    width:100%;
    border-collapse:collapse;
    background:#F8F8F2;
    border-radius:10px;
    overflow:hidden;
}

th{
    background:#1E3A8A;
    color:white;
    padding:12px;
}

td{
    padding:12px;
    text-align:center;
    border-bottom:1px solid #ddd;
}


/* Status colours */

.pending{
    color:#E67E22;
    font-weight:bold;
}

.progress{
    color:#2563EB;
    font-weight:bold;
}

.resolved{
    color:green;
    font-weight:bold;
}


/* Select */

select{
    padding:6px;
    border-radius:5px;
}


/* Button */

button{
    background:#2563EB;
    color:white;
    border:none;
    padding:7px 14px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#1D4ED8;
}

</style>

</head>


<body>


<!-- HEADER -->

<header>

<h2>Complaint Management System - Admin</h2>

<a href="login.html" class="logout">
Logout
</a>

</header>



<!-- MAIN -->

<div class="container">

<h1>Admin Dashboard</h1>


<!-- SUMMARY CARDS -->

<div class="cards">


<div class="card">

<h2 id="totalCount">0</h2>

<p>Total Complaints</p>

</div>



<div class="card">

<h2 id="pendingCount">0</h2>

<p>Pending</p>

</div>



<div class="card">

<h2 id="progressCount">0</h2>

<p>In Progress</p>

</div>



<div class="card">

<h2 id="resolvedCount">0</h2>

<p>Resolved</p>

</div>


</div>



<!-- COMPLAINT TABLE -->

<table>

<tr>

<th>ID</th>

<th>User</th>

<th>Title</th>

<th>Category</th>

<th>Status</th>
<th>View</th>


<th>Update</th>

</tr>


<tbody id="complaintTableBody">

</tbody>


</table>


</div>



<!-- JAVASCRIPT -->

<script>
    let userRole = localStorage.getItem("userRole");

if (userRole !== "admin") {
    alert("Access denied. Admins only.");
    window.location.href = "dashboard.html";
}


// ======================================
// LOAD ALL COMPLAINTS
// ======================================

async function loadComplaints() {

    try {

        let response =
            await fetch(
                "http://localhost:8084/admincomplaints"
            );


        let result =
            await response.text();


        if (result === "ERROR") {

            alert(
                "Could not load complaints."
            );

            return;
        }


        let tableBody =
            document.getElementById(
                "complaintTableBody"
            );


        tableBody.innerHTML = "";


        if (result.trim() === "") {

            tableBody.innerHTML =
                "<tr>" +
                "<td colspan='6'>" +
                "No complaints found" +
                "</td>" +
                "</tr>";

            return;
        }


        let complaints =
            result.trim().split("\n");


        let total = 0;

        let pending = 0;

        let progress = 0;

        let resolved = 0;



        // ======================================
        // CREATE TABLE ROWS
        // ======================================

        for (
            let complaint of complaints
        ) {


            let data =
                complaint.split("|");


            let id =
                data[0];

            let user =
                data[1];

            let title =
                data[2];

            let category =
                data[3];

            let description =
                data[4];

            let location =
                data[5];

            let status =
                data[6];

            let date =
                data[7];



            total++;



            // Count statuses

            if (
                status === "Pending"
            ) {

                pending++;

            }

            else if (
                status === "In Progress"
            ) {

                progress++;

            }

            else if (
                status === "Resolved"
            ) {

                resolved++;

            }



            // Status CSS class

            let statusClass = "";


            if (
                status === "Pending"
            ) {

                statusClass =
                    "pending";

            }

            else if (
                status === "In Progress"
            ) {

                statusClass =
                    "progress";

            }

            else if (
                status === "Resolved"
            ) {

                statusClass =
                    "resolved";

            }



            // Create row

            let row =
                document.createElement(
                    "tr"
                );



row.innerHTML =

    "<td>" +
    id +
    "</td>" +

    "<td>" +
    user +
    "</td>" +

    "<td>" +
    title +
    "</td>" +

    "<td>" +
    category +
    "</td>" +

    "<td class='" +
    statusClass +
    "'>" +
    status +
    "</td>" +

    "<td>" +

    "<button onclick='viewComplaint(" +
    id +
    ", " +
    JSON.stringify(title) +
    ", " +
    JSON.stringify(category) +
    ", " +
    JSON.stringify(description) +
    ", " +
    JSON.stringify(location) +
    ", " +
    JSON.stringify(status) +
    ", " +
    JSON.stringify(date) +
    ")'>" +

    "View" +

    "</button>" +

    "</td>" +

    "<td>" +

    "<select id='status_" +
    id +
    "'>" +

    "<option " +
    (status === "Pending" ? "selected" : "") +
    ">Pending</option>" +

    "<option " +
    (status === "In Progress" ? "selected" : "") +
    ">In Progress</option>" +

    "<option " +
    (status === "Resolved" ? "selected" : "") +
    ">Resolved</option>" +

    "</select>" +

    " " +

    "<button onclick='updateStatus(" +
    id +
    ")'>" +

    "Save" +

    "</button>" +

    "</td>";


            tableBody.appendChild(
                row
            );

        }



        // ======================================
        // UPDATE SUMMARY COUNTS
        // ======================================

        document.getElementById(
            "totalCount"
        ).innerText =
            total;


        document.getElementById(
            "pendingCount"
        ).innerText =
            pending;


        document.getElementById(
            "progressCount"
        ).innerText =
            progress;


        document.getElementById(
            "resolvedCount"
        ).innerText =
            resolved;


    }

    catch (error) {

        alert(
            "Could not connect to Admin server."
        );

        console.log(error);

    }

}



// ======================================
// UPDATE COMPLAINT STATUS
// ======================================
function viewComplaint(id, title, category, description, location, status, date) {

    alert(
        "Complaint ID: " + id +
        "\n\nTitle: " + title +
        "\nCategory: " + category +
        "\nDescription: " + description +
        "\nLocation: " + location +
        "\nStatus: " + status +
        "\nDate: " + date
    );
}

async function updateStatus(id) {

    

    let select =
        document.getElementById(
            "status_" + id
        );


    let status =
        select.value;



    try {


        let response =
            await fetch(
                "http://localhost:8084/updatestatus",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                        "application/x-www-form-urlencoded"

                    },

                    body:

                        "id=" +
                        encodeURIComponent(id) +

                        "&status=" +
                        encodeURIComponent(status)

                }
            );



        let result =
            await response.text();



        if (
            result === "SUCCESS"
        ) {


            alert(
                "Complaint status updated successfully!"
            );


            // Reload complaints

            loadComplaints();


        }

        else {


            alert(
                "Could not update complaint status."
            );

        }


    }

    catch (error) {


        alert(
            "Could not connect to Admin server."
        );


        console.log(error);

    }

}



// ======================================
// LOAD COMPLAINTS WHEN PAGE OPENS
// ======================================

loadComplaints();


</script>


</body>

</html>
