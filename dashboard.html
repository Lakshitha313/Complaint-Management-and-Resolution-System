<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Dashboard</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#0F172A;
}

/* Header */

header{
    background:#1E3A8A;
    color:white;
    padding:18px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h2{
    font-size:24px;
}

.logout{
    background:#EF4444;
    color:white;
    padding:10px 18px;
    text-decoration:none;
    border-radius:6px;
}

.logout:hover{
    background:#DC2626;
}

/* Main */

.container{
    width:90%;
    margin:30px auto;
}

.welcome{
    color:white;
    margin-bottom:25px;
}

.cards{
    display:flex;
    gap:25px;
    justify-content:center;
    flex-wrap:wrap;
}

.card{
    width:260px;
    background:#F8F8F2;
    border-radius:12px;
    padding:25px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,.25);
}

.card h3{
    color:#1E3A8A;
    margin-bottom:15px;
}

.card p{
    color:#555;
    margin-bottom:20px;
}

.card button{
    background:#2563EB;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:6px;
    cursor:pointer;
}

.card button:hover{
    background:#1D4ED8;
}

</style>

</head>

<body>

<header>

<h2>Complaint Management System</h2>

<a href="#" onclick="logout()" class="logout">Logout</a>

</header>

<div class="container">

<div class="welcome">
<h1 id="welcomeMessage">Welcome 👋</h1>
<p>Manage your complaints from one place.</p>
</div>

<div class="cards">

<div class="card">
<h3>Submit Complaint</h3>
<p>Register a new complaint.</p>
<button onclick="submitComplaint()">Open</button>
</div>

<div class="card">
<h3>My Complaints</h3>
<p>View all your complaints.</p>
<button onclick="viewComplaints()">Open</button>
</div>

<div class="card">
<h3>Admin Dashboard</h3>
<p>View and manage all complaints.</p>
<button onclick="openAdmin()">Open</button>
</div>

</div>


</div>

</div>

<script>

let userName = localStorage.getItem("userName");
console.log("USER NAME:", userName);
if (userName !== null) {

    document.getElementById("welcomeMessage").innerText =
        "Welcome, " + userName + " 👋";

}

function submitComplaint(){

    window.location.href = "complaint.html";

}

function viewComplaints(){

    window.location.href = "mycomplaints.html";

}
function openAdmin(){
    window.location.href = "admin.html";
}

function logout(){

    localStorage.clear();

    window.location.href = "login.html";

}

</script>

</body>
</html>
